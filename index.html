<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZendoApp</title>
<meta name="theme-color" content="#0b0a07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ZendoApp">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: columna de celular, bloques sólidos apilados, números gigantes, oro sólo para lo que importa */
:root{
  --ink:#0b0a07; --slab:#17150f; --line:#3b3529; --bone:#efe9da; --dim:#958d7c;
  --gold:#d9a521; --goldink:#1a1404; --alert:#e0472c;
  --fd:'Big Shoulders Display',Impact,'Arial Narrow Bold',sans-serif;
  --fb:'Archivo',system-ui,-apple-system,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--ink);color:var(--bone)}
body{font-family:var(--fb);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:3px solid var(--bone)}
.brand{font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.02em;line-height:1;flex:1}
.brand small{display:block;font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.ib{height:40px;min-width:40px;padding:0 10px;border:2px solid var(--line);font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.ib:hover{border-color:var(--bone)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--gold);color:var(--goldink);font-family:var(--fm);font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);border-top:3px solid var(--bone);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{height:64px;font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.06em;color:var(--dim);border-right:1px solid var(--line)}
.nav button:last-child{border-right:0}
.nav button.on{background:var(--gold);color:var(--goldink)}

/* type */
.eyebrow{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.h1{font-family:var(--fd);font-weight:900;font-size:clamp(56px,17vw,92px);line-height:.86;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance;margin:0}
.h2{font-family:var(--fd);font-weight:900;font-size:34px;line-height:.95;text-transform:uppercase;margin:0}
.h3{font-family:var(--fd);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;margin:0;letter-spacing:.02em}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.gold{color:var(--gold)}

/* blocks */
.stack{display:flex;flex-direction:column;gap:32px;padding-top:24px}
.sec{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--bone);padding-bottom:8px}
.slab{border:3px solid var(--bone);padding:20px}
.slab.gold{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.slab.gold .eyebrow{color:var(--goldink);opacity:.75}
.slab.dark{background:var(--slab);border-color:var(--line)}

.bignum{display:flex;align-items:flex-end;gap:12px;line-height:.8}
.bignum .n{font-family:var(--fd);font-weight:900;font-size:clamp(110px,34vw,168px);letter-spacing:-.03em}
.bignum .l{font-family:var(--fd);font-weight:800;font-size:26px;text-transform:uppercase;padding-bottom:10px;line-height:.95}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cells i{display:block;aspect-ratio:1;max-width:100%;border:2px solid var(--line)}
.cells i.f{background:var(--gold);border-color:var(--gold)}
.cells i.u{background:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.06em}

.areabig{font-family:var(--fd);font-weight:900;font-size:clamp(64px,21vw,112px);line-height:.85;text-transform:uppercase;letter-spacing:-.01em}
.note{border-left:6px solid currentColor;padding:6px 0 6px 12px;font-weight:500}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-family:var(--fm);font-size:12px;color:var(--dim);letter-spacing:.04em}
.idx{font-family:var(--fd);font-weight:900;font-size:26px;width:42px;flex:none;line-height:1}

.code{display:inline-grid;place-items:center;min-width:48px;height:30px;padding:0 6px;background:var(--bone);color:var(--ink);font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:.04em}
.code.g{background:var(--gold);color:var(--goldink)}
.code.o{background:none;color:var(--dim);border:2px dashed var(--line)}
.codes{display:flex;flex-wrap:wrap;gap:4px}

.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;border:2px solid var(--line);white-space:nowrap}
.pill.g{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.pill.w{border-color:var(--gold);color:var(--gold)}
.pill.r{border-color:var(--alert);color:var(--alert)}
.pill.b{background:var(--bone);border-color:var(--bone);color:var(--ink)}

.btn{height:46px;padding:0 16px;font-family:var(--fd);font-weight:900;font-size:19px;letter-spacing:.06em;text-transform:uppercase;border:3px solid var(--bone);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--bone);color:var(--ink)}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.btn.g:hover{filter:brightness(1.08)}
.btn.s{height:38px;font-size:16px;padding:0 12px;border-width:2px}
.btn.x{border-color:var(--line);color:var(--dim)}
.btn.x:hover{background:none;border-color:var(--alert);color:var(--alert)}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* points: gráfico de barras de prioridad */
.vchart{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.vc{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;text-align:center}
.vt{height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-bottom:3px solid var(--bone);background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 42.5px)}
.vt b{display:block;background:var(--bone);min-height:3px}
.vt span{font-family:var(--fd);font-weight:900;font-size:22px;line-height:1;padding-bottom:4px}
.vc.top .vt b{background:var(--gold)}
.vc.top .vt span{color:var(--gold)}
.vc .code{min-width:0;width:100%}
.vc .pct{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--dim)}
.vc.top .pct{color:var(--gold)}
/* asistencia */
.att{aspect-ratio:1;max-width:100%;border:2px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font-family:var(--fd);font-weight:800;font-size:15px;line-height:1;min-width:0}
.att b{font-family:var(--fm);font-size:10px;font-weight:700;align-self:flex-end}
.att.ap{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.att.aa{border-color:var(--alert);color:var(--alert)}
.att.ac{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--slab) 5px 10px);color:var(--line)}
.att.af{opacity:.3}
.att.at{outline:2px solid var(--bone);outline-offset:1px}
.lg{display:inline-block;width:12px;height:12px;vertical-align:-1px;border:2px solid var(--line)}
.lg.ap{background:var(--gold);border-color:var(--gold)}.lg.aa{border-color:var(--alert)}.lg.ac{background:var(--slab)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.statrow>div{border-top:3px solid var(--bone);padding-top:8px;min-width:0}
/* leaderboard */
.lbtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.lbtabs button{flex:none;height:38px;padding:0 12px;border:2px solid var(--line);font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:.04em}
.lbtabs button.on{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end}
.pod{border:3px solid var(--bone);padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pod .pos{font-family:var(--fd);font-weight:900;font-size:44px;line-height:.8}
.pod .nm{font-weight:800;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.pod .val{font-family:var(--fd);font-weight:900;font-size:28px;line-height:1}
.pod.p1{background:var(--gold);border-color:var(--gold);color:var(--goldink);min-height:200px;justify-content:flex-end}
.pod.p1 .pos{font-size:72px}
.pod.p2{min-height:160px;justify-content:flex-end}
.pod.p3{min-height:130px;justify-content:flex-end}
.pod.me{outline:3px solid var(--alert);outline-offset:2px}
.lbrow.me{background:var(--slab);margin:0 -8px;padding-left:8px;padding-right:8px}
/* radar */
.radar{width:100%;max-width:340px;margin:0 auto;display:block}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stp{display:flex;align-items:center;gap:6px;border:2px solid var(--line);padding:4px 4px 4px 10px;min-width:0}
.stp .nm{flex:1;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.06em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stp .v{font-family:var(--fd);font-weight:900;font-size:26px;width:30px;text-align:center}
.stp button{width:34px;height:34px;border:2px solid var(--line);font-family:var(--fd);font-weight:900;font-size:20px}
.stp button:hover{border-color:var(--gold);color:var(--gold)}
/* planner por día */
.wtabs{display:flex;gap:4px;overflow-x:auto}
.wtabs button{flex:1 0 auto;min-width:64px;padding:6px 8px;border:2px solid var(--line);text-align:left}
.wtabs button b{display:block;font-family:var(--fd);font-weight:900;font-size:20px;line-height:1}
.wtabs button span{font-family:var(--fm);font-size:10px;color:var(--dim)}
.wtabs button.on{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.wtabs button.on span{color:var(--goldink)}
.wtabs button.cw:not(.on){border-color:var(--bone)}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.mini div{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-width:0}
.mini .dl{font-family:var(--fm);font-size:9px;font-weight:700;opacity:.7}
.mini .code{min-width:0;height:22px;font-size:13px}
.mini .x{height:22px;border:2px dashed currentColor;opacity:.25}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dh{font-family:var(--fm);font-size:10px;font-weight:700;color:var(--dim);text-align:center;padding:4px 0;letter-spacing:.08em}
.cal .d{aspect-ratio:1;max-width:100%;border:2px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:4px;font-family:var(--fd);font-weight:800;font-size:18px;line-height:1;text-align:left;min-width:0}
.cal .d .k{font-family:var(--fm);font-size:9px;font-weight:700;color:var(--dim);letter-spacing:0;overflow:hidden;white-space:nowrap}
.cal .d.off{opacity:.28;pointer-events:none}
.cal .d.closed{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--slab) 5px 10px);color:var(--dim);pointer-events:none}
.cal .d.today{border-color:var(--bone)}
.cal .d.sel{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.cal .d.sel .k{color:var(--goldink)}
.cal .d.has .k{color:var(--gold)}
.cal .d.sel.has .k{color:var(--goldink)}
.calnav{display:flex;align-items:center;gap:8px}
.calnav .h3{flex:1}

.slot{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .hr{font-family:var(--fd);font-weight:900;font-size:32px;line-height:.9}
.slot .hr small{display:block;font-family:var(--fm);font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-top:3px}
.spots{display:flex;gap:3px}
.spots i{width:12px;height:18px;border:2px solid var(--line)}
.spots i.f{background:var(--bone);border-color:var(--bone)}
.spots i.p{border-color:var(--gold);background:repeating-linear-gradient(135deg,var(--gold) 0 2px,transparent 2px 5px)}

/* alert tiles */
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow>.btn{flex:none;width:34px;padding:0}
.trow:last-child{border-bottom:0}
.tt{display:flex;flex-direction:column;flex:none;line-height:1}
.tt .h3{font-size:24px}
.tt small{font-family:var(--fm);font-size:10px;font-weight:700;color:var(--dim);white-space:nowrap;margin-top:3px}
.dsel{display:flex;gap:3px;flex:1;min-width:0}
.dsel button{flex:1;min-width:0;padding:0;height:34px;border:2px solid var(--line);font-family:var(--fd);font-weight:900;font-size:15px;color:var(--dim)}
.dsel button.on{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.dsel.big button{height:40px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.markcard{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.markcard:last-child{border-bottom:0}
.mmid{display:flex;gap:8px;flex-wrap:wrap}
.mbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lchart{width:100%;display:block}
.ckcard{border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.ckcard:first-of-type{border-color:var(--bone)}
.ckh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ckgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.ckc{min-width:0}
.ckn{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);line-height:1.2}
.ckv{font-family:var(--fd);font-weight:900;font-size:28px;line-height:1;margin-top:3px}
.ckv small{font-family:var(--fm);font-size:10px;font-weight:700;color:var(--dim);margin-left:3px}
.ckd{font-family:var(--fm);font-size:11px;font-weight:700;color:var(--gold);margin-top:2px}
.ptabs{border-bottom:3px solid var(--bone);padding-bottom:10px}
.tile{border:3px solid var(--line);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .n{font-family:var(--fd);font-weight:900;font-size:46px;line-height:.8}
.tile .l{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);line-height:1.25}
.tile.hot{border-color:var(--gold)}
.tile.hot .n{color:var(--gold)}
.tile.zero .n{color:var(--line)}

/* planner */
.brush{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brush button.code{height:36px;min-width:52px;font-size:18px;opacity:.55;border:2px solid transparent}
.brush button.code.on{opacity:1;background:var(--gold);color:var(--goldink);outline:3px solid var(--bone);outline-offset:1px}
.tablewrap{overflow-x:auto;margin:0 -2px}
table.plan{border-collapse:collapse;width:100%;min-width:480px}
table.plan th{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-align:left;padding:6px 4px;border-bottom:3px solid var(--bone);white-space:nowrap}
table.plan th.cw{color:var(--bone)}
table.plan td{border-bottom:1px solid var(--line);padding:4px;vertical-align:middle}
table.plan td.nm{font-weight:700;font-size:13px;white-space:nowrap;padding-right:8px}
table.plan td.nm button{text-align:left;font-weight:800}
table.plan td.nm button:hover{color:var(--gold)}
.cell{width:100%;min-height:44px;border:2px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;padding:3px}
.cell:hover{border-color:var(--bone)}
.cell.cw{border-color:var(--dim)}
.cell .code{min-width:0;height:18px;font-size:12px;padding:0 3px}
.cell .empty{color:var(--line);font-family:var(--fd);font-weight:900;font-size:18px}
.rep{font-family:var(--fm);font-size:10px;font-weight:700;padding:6px;border:2px solid var(--line);color:var(--dim)}
.rep.on{border-color:var(--gold);color:var(--gold)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.inp{height:46px;background:var(--slab);border:2px solid var(--line);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:80px;padding:10px 12px}
.inp:focus{border-color:var(--gold);outline:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{height:40px;min-width:48px;padding:0 10px;border:2px solid var(--line);font-family:var(--fd);font-weight:900;font-size:17px}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch .tg{width:58px;height:30px;border:2px solid var(--line);position:relative;flex:none}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--dim)}
.switch .tg.on{border-color:var(--gold)}
.switch .tg.on::after{left:31px;background:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,5,3,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--ink);border-top:6px solid var(--gold);padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding-block:28px}
.mark{font-family:var(--fd);font-weight:900;font-size:clamp(84px,28vw,150px);line-height:.8;letter-spacing:-.02em;text-transform:uppercase}
.mark span{color:var(--gold)}
.demo{border-top:3px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 10px;border:2px solid var(--line);font-size:13px;font-weight:700}
.chip:hover{border-color:var(--bone)}
.chip.g{border-color:var(--gold);color:var(--gold)}

<body>
<div id="root"></div>

<script src="/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
/* ============ CONSTANTES ============ */
const AREAS=[['CAR','Cardio'],['MUS','Musculación'],['POT','Potencia'],['FUE','Fuerza'],['BOX','Boxeo'],['MMA','MMA']];
const AN=Object.fromEntries(AREAS);
const PTS=15;
const DOW=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MON=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MONL=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const KEY='zendoapp-demo-v3';
const STATS=[['pot','Potencia'],['vel','Velocidad'],['tec','Técnica'],['def','Defensa'],['fue','Fuerza'],['car','Cardio']];
const STATS_F=[['pot','Potencia'],['vel','Velocidad'],['agi','Agilidad'],['coo','Coordinación'],['fue','Fuerza'],['car','Cardio']];
const statsOf=st=>isCombat(st)?STATS:STATS_F;
const CHK=[['peso','Peso','kg'],['bicR','Bíceps relajado','cm'],['bicC','Bíceps contraído','cm'],['cuad','Cuádriceps','cm'],['cint','Cintura baja','cm'],['gem','Gemelos','cm'],['homb','Hombros','cm'],['glut','Glúteos','cm'],['ante','Antebrazo','cm']];
const WD=[1,2,3,4,5,6,0];
const RANGOS=['A+','A','A-','B+','B','B-','C+','C','C-'];
const CLASES=[['pres','Presionador'],['tec','Técnico'],['tir','Tirador'],['def','Defensivo'],['rup','Rupturista'],['con','Contraatacador']];
const claseN=k=>(CLASES.find(c=>c[0]===k)||[])[1]||null;
const isCombat=st=>st.disc==='Boxeo'||st.disc==='MMA'; // orden lunes→domingo

/* ============ FECHAS ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const TODAY=iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const mh=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fd=s=>{const d=P(s);return pad(d.getDate())+' '+MON[d.getMonth()]};
const fdw=s=>DOW[P(s).getDay()]+' '+fd(s);
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
// Semanas del mes = filas del calendario (lunes a domingo). Semana 1 = la que contiene el día 1.
const leadOf=ym=>{const[y,m]=ym.split('-').map(Number);return(new Date(y,m-1,1).getDay()+6)%7};
const weekIdx=s=>Math.floor((P(s).getDate()-1+leadOf(s.slice(0,7)))/7);
function weeksOf(ym){const[y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();const L=leadOf(ym);const n=Math.ceil((last+L)/7);
  return Array.from({length:n},(_,i)=>{const byDow={};const inMonth=[];for(let k=0;k<7;k++){const d=i*7+k-L+1;const s=d>=1&&d<=last?ym+'-'+pad(d):null;byDow[WD[k]]=s;if(s)inMonth.push(s)}return{i,byDow,first:inMonth[0],last:inMonth[inMonth.length-1]}})}
const mondayOf=s=>add(s,-((P(s).getDay()+6)%7));
const age=s=>{if(!s)return null;const b=P(s),t=P(TODAY);let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a};
const emptyWeeks=()=>Array.from({length:6},()=>({0:[],1:[],2:[],3:[],4:[],5:[],6:[]}));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ============ DATOS DE EJEMPLO ============ */
function defaultCfg(){return {cupo:6,anticipacion:15,ausenteDescuenta:true,dias:[1,2,3,4,5,6],
    turnos:[{h:'08:00',d:60},{h:'09:30',d:90},{h:'11:30',d:60},{h:'14:00',d:60},{h:'15:30',d:60},{h:'17:00',d:90},{h:'18:40',d:80}],
    precios:{8:40000,12:54000,16:68000},alertaVence:5,alertaSesiones:2,inactivo:7}}
function seed(){
  const cfg=defaultCfg();
  const D={cfg,students:[],sessions:[],res:[],pays:[]};
  const open=s=>cfg.dias.includes(P(s).getDay());
  const openBetween=(a,b)=>{const out=[];for(let s=a;s<b;s=add(s,1))if(open(s))out.push(s);return out};
  const ym=TODAY.slice(0,7);
  const defs=[
    {n:'Lucía',a:'Romero',disc:'Preparación física',size:16,ago:12,used:6,abs:1,plan:[['FUE'],['MUS'],['POT'],['FUE','CAR'],['CAR']],base:{CAR:120,MUS:180,POT:90,FUE:225,BOX:0,MMA:0},rec:[['Sentadilla','70 kg',-6],['Peso muerto','95 kg',-20]],prev:true},
    {n:'Tomás',a:'Aguirre',disc:'Boxeo',size:12,ago:27,used:9,abs:0,plan:[['BOX'],['BOX','CAR'],['POT'],['BOX']],base:{CAR:150,MUS:30,POT:75,FUE:45,BOX:330,MMA:0},rec:[['Burpees 1 min','22 reps',-9]]},
    {n:'Valentina',a:'Sosa',disc:'MMA',size:8,ago:20,used:7,abs:1,plan:[['MMA'],['FUE'],['MMA','CAR'],['MMA']],base:{CAR:90,MUS:15,POT:60,FUE:105,BOX:45,MMA:270},rec:[['Dominadas','9 reps',-4]],prev:true},
    {n:'Facundo',a:'Ibarra',disc:'Preparación física',size:16,ago:5,used:3,abs:0,plan:[['MUS'],['MUS'],['FUE'],['MUS','POT'],['MUS']],base:{CAR:45,MUS:240,POT:60,FUE:150,BOX:0,MMA:0},rec:[['Press banca','80 kg',-15],['Remo con barra','70 kg',-15]]},
    {n:'Camila',a:'Ledesma',disc:'Boxeo',size:8,ago:25,used:3,abs:0,stopAgo:17,plan:[['BOX'],['CAR'],['BOX'],['BOX']],base:{CAR:60,MUS:0,POT:15,FUE:30,BOX:120,MMA:0},rec:[]},
    {n:'Nicolás',a:'Ferreyra',disc:'MMA',size:12,ago:9,used:4,abs:1,plan:[['MMA'],['POT'],['MMA'],['FUE','MMA'],['MMA']],base:{CAR:75,MUS:45,POT:120,FUE:90,BOX:60,MMA:195},rec:[['Salto al cajón','90 cm',-30]],prev:true},
    {n:'Martina',a:'Quiroga',disc:'Preparación física',size:12,ago:31,used:10,abs:0,plan:[['CAR'],['CAR'],['MUS'],['CAR']],base:{CAR:210,MUS:90,POT:30,FUE:60,BOX:0,MMA:0},rec:[['Remo 500 m','1:52',-12]]},
    {n:'Joaquín',a:'Paz',disc:'Boxeo',size:16,ago:2,used:1,abs:0,plan:[['BOX'],['FUE'],['BOX','POT'],['BOX'],['BOX']],base:{CAR:30,MUS:15,POT:45,FUE:30,BOX:90,MMA:0},rec:[]},
  ];
  const baseSp=[0,140,96,0,22,118,0,30];
  const alturas=[165,178,162,183,158,176,170,174];
  const extra=[['1996-03-14',61,[5,6,6,5,7,7]],['2001-07-02',72,[7,8,6,5,5,8]],['1999-11-20',58,[6,7,7,6,6,7]],['1993-05-09',84,[7,4,5,5,8,5]],['2003-01-27',55,[4,5,4,4,4,5]],['1998-09-15',77,[7,7,6,7,7,6]],['1990-12-03',66,[4,5,5,5,5,8]],['2005-04-18',69,[5,6,4,4,5,5]]];
  defs.forEach((f,i)=>{
    const id='s'+(i+1);
    const start=add(TODAY,-f.ago);
    const weeks=emptyWeeks();
    weeks.forEach((w,wi)=>{const src=f.plan[wi]||f.plan[f.plan.length-1];[1,2,3,4,5,6].forEach((d,k)=>{w[d]=[src[k%src.length]]})});
    const ex=extra[i];
    const st={id,nombre:f.n,apellido:f.a,disc:f.disc,nac:ex[0],peso:ex[1],altura:alturas[i],stats:Object.fromEntries([...STATS,['agi'],['coo']].map(([k],j)=>[k,ex[2][j%6]])),
      pack:{size:f.size,start},base:f.base,baseSp:baseSp[i],rango:['','B+','A-','','C+','A','','C'][i]||null,clase:['','pres','tec','','con','rup','','tir'][i]||null,logros:({1:[['Primer sparring de 6 rounds',-20],['Sin faltar en todo el mes',-3]],2:[['Primera competencia amateur',-12]],5:[['Ganó su pelea de exhibición',-8],['10 rounds en una sesión',-25],['Primer sparring',-60]]}[i]||[]).map(l=>({id:nid(),texto:l[0],fecha:add(TODAY,l[1])})),plan:{weeks,repeat:true,month:ym},checks:[],
      notes:{},records:f.rec.map(r=>({id:nid(),ej:r[0],marca:r[1],fecha:add(TODAY,r[2])}))};
    if(i<3){st.checks.push({id:nid(),fecha:add(TODAY,-40),peso:ex[1]+1.2,bicR:31,bicC:33.5,cuad:55,cint:80,gem:36,homb:108,glut:96,ante:26.5});
      st.checks.push({id:nid(),fecha:add(TODAY,-(8+i*3)),peso:ex[1],bicR:31.5,bicC:34.5,cuad:56,cint:78.5,gem:36.5,homb:109,glut:97})}
    D.students.push(st);
    D.pays.push({id:nid(),sid:id,date:start,size:f.size,monto:cfg.precios[f.size]});
    if(f.prev)D.pays.push({id:nid(),sid:id,date:add(start,-30),size:f.size,monto:cfg.precios[f.size]});
    const endW=f.stopAgo?add(TODAY,-f.stopAgo):TODAY;
    const days=openBetween(start,endW);
    const total=f.used+f.abs;
    const step=days.length/Math.max(1,total);
    for(let k=0;k<total&&k<days.length;k++){
      const date=days[Math.floor(k*step)];
      const wk=(st.plan.weeks[weekIdx(date)]||{})[P(date).getDay()]||['CAR'];
      D.sessions.push({id:nid(),sid:id,date,h:cfg.turnos[(i*2+k)%cfg.turnos.length].h,area:wk[0],sp:(['BOX','MMA'].includes(wk[0])&&f.disc!=='Preparación física')?2+((i+k)%4):0,status:(f.abs&&k===Math.floor(total/2))?'A':'P'});
    }
  });
  // notas de ejemplo
  const s1=D.students[0];
  const nd1=openBetween(TODAY,add(TODAY,6))[1]; if(nd1)s1.notes[nd1]={area:'FUE',text:'Test de sentadilla: buscar 75 kg x 3'};
  const s4=D.students[3];
  const nd4=openBetween(TODAY,add(TODAY,6))[0]; if(nd4)s4.notes[nd4]={area:'MUS',text:'Día de espalda y bíceps'};
  // reservas por marcar (último día abierto anterior a hoy)
  let lo=add(TODAY,-1);while(!open(lo))lo=add(lo,-1);
  ['s1','s4','s6'].forEach(sid=>D.res.push({id:nid(),sid,date:lo,h:'17:00',status:'ok'}));
  D.res.push({id:nid(),sid:'s2',date:lo,h:'18:40',status:'ok'});
  // futuras confirmadas
  const fut=openBetween(TODAY,add(TODAY,14));
  const pattern=[['s1','17:00'],['s4','09:30'],['s6','18:40'],['s2','18:40'],['s8','17:00'],['s3','11:30'],['s1','08:00']];
  fut.forEach((d,j)=>{pattern.forEach((p,k)=>{if((j+k)%3===0)D.res.push({id:nid(),sid:p[0],date:d,h:p[1],status:'ok'})})});
  // completar el turno de 17:00 del próximo día abierto
  if(fut[1])['s2','s3','s5','s7','s8'].forEach(sid=>{if(!D.res.some(r=>r.date===fut[1]&&r.h==='17:00'&&r.sid===sid))D.res.push({id:nid(),sid,date:fut[1],h:'17:00',status:'ok'})});
  // solicitudes pendientes
  if(fut[1])D.res.push({id:nid(),sid:'s3',date:fut[1],h:'09:30',status:'pend'});
  if(fut[3])D.res.push({id:nid(),sid:'s8',date:fut[3],h:'14:00',status:'pend'});
  return D;
}

/* ============ ESTADO ============ */
/* ============ DATOS: Firebase (real) o localStorage (demo) ============ */
const FBCFG=window.FIREBASE_CONFIG||null;
const ADMIN_EMAIL=String(window.ADMIN_EMAIL||'').trim().toLowerCase();
const LIVE=!!(FBCFG&&FBCFG.apiKey&&window.firebase);
const COLS=['students','sessions','res','pays'];
const emptyD=()=>({cfg:defaultCfg(),students:[],sessions:[],res:[],pays:[]});
let D,fdb=null,fauth=null,synced={},unsub=[],loggingIn=false,pendingLive=false,liveT=null,seenPend=null;
if(LIVE)D=emptyD();
else{try{const raw=localStorage.getItem(KEY);D=raw?JSON.parse(raw):null}catch(e){D=null}if(!D||!D.cfg)D=seed()}
function save(){
  if(!LIVE){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}return}
  push();
}
// Compara lo que hay en pantalla con lo último que llegó del servidor y sube sólo lo que cambió.
function push(){
  if(!fdb||!U.role)return;
  const admin=U.role==='admin';const ops=[];
  if(admin&&synced.cfg!==undefined){const j=JSON.stringify(D.cfg);if(j!==synced.cfg){ops.push(b=>b.set(fdb.doc('meta/config'),JSON.parse(j)));synced.cfg=j}}
  for(const c of COLS){
    if(!admin&&c!=='res')continue;
    if(synced[c]===undefined)continue; // todavía no llegó del servidor: no pisar nada
    const cur={};D[c].forEach(x=>{cur[x.id]=JSON.stringify(x)});
    const prev=synced[c];
    for(const id in cur)if(cur[id]!==prev[id]){const data=JSON.parse(cur[id]);if(!admin&&(prev[id]||data.status!=='pend'))continue;ops.push(b=>b.set(fdb.collection(c).doc(id),data))}
    if(admin)for(const id in prev)if(!(id in cur))ops.push(b=>b.delete(fdb.collection(c).doc(id)));
    synced[c]=cur;
  }
  for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(f=>f(b));b.commit().catch(e=>{console.error(e);toast('No se pudo guardar. Revisá la conexión.')})}
}
function listen(){
  stopListen();const admin=U.role==='admin';
  const onErr=c=>e=>{console.warn(c,e);if(e.code==='permission-denied')toast('Sin permiso para leer '+c+'. Revisá las reglas de Firebase.')};
  unsub.push(fdb.doc('meta/config').onSnapshot(d=>{
    if(d.exists){D.cfg=Object.assign(defaultCfg(),d.data());synced.cfg=JSON.stringify(D.cfg)}
    else{synced.cfg='';if(admin)push()}
    live()},onErr('config')));
  (admin?COLS:['students','sessions','res']).forEach(c=>unsub.push(fdb.collection(c).onSnapshot(q=>{
    D[c]=q.docs.map(d=>d.data());synced[c]=Object.fromEntries(D[c].map(x=>[x.id,JSON.stringify(x)]));live()},onErr(c))));
}
function stopListen(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[]}
const isLoaded=()=>!LIVE||(synced.cfg!==undefined&&synced.students!==undefined&&synced.sessions!==undefined&&synced.res!==undefined);
// Redibuja cuando llegan datos nuevos, pero espera si estás escribiendo en un campo.
function live(){clearTimeout(liveT);liveT=setTimeout(()=>{
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingLive=true;return}
  const y=window.scrollY;render();window.scrollTo(0,y);notifyCheck()},80)}
document.addEventListener('focusout',()=>{if(pendingLive){pendingLive=false;setTimeout(live,50)}});
function notifyCheck(){
  if(U.role!=='admin'||!isLoaded())return;
  const ids=pending().map(r=>r.id);
  if(seenPend===null){seenPend=new Set(ids);return}
  const fresh=ids.filter(id=>!seenPend.has(id));ids.forEach(id=>seenPend.add(id));
  if(!fresh.length)return;
  toast(fresh.length===1?'Nueva solicitud de turno':'Nuevas solicitudes: '+fresh.length);
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  fresh.forEach(id=>{const r=D.res.find(x=>x.id===id);const st=stu(r.sid);const title='Solicitud de turno';const body=(st?fullName(st):'Alumno')+' · '+fdw(r.date)+' '+r.h;
    const plain=()=>{try{new Notification(title,{body})}catch(e){}};
    if(navigator.serviceWorker)navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'/icons/icon-192.png',badge:'/icons/icon-192.png',tag:id})).catch(plain);
    else plain()});
}
let U={role:null,sid:null,tab:null,selDay:null,calMonth:TODAY.slice(0,7),prof:null,brush:null,planMonth:TODAY.slice(0,7),sheet:null,agDay:TODAY,adminForm:false};
try{const r=localStorage.getItem(KEY+'-u');if(r){const o=JSON.parse(r);U.sid=o.sid||null;U.tab=o.tab||null;if(!LIVE)U.role=o.role||null}}catch(e){}
const saveU=()=>{try{localStorage.setItem(KEY+'-u',JSON.stringify({role:U.role,sid:U.sid,tab:U.tab}))}catch(e){}};
/* ---- Avisos (Firebase Cloud Messaging) ---- */
const VAPID=window.FCM_VAPID_KEY||null;
const pushReady=()=>LIVE&&!!VAPID&&'Notification' in window&&'serviceWorker' in navigator&&!!(firebase.messaging&&firebase.messaging.isSupported&&firebase.messaging.isSupported());
let msgInit=false;
async function registerPush(){
  if(!pushReady()||Notification.permission!=='granted'||!U.role)return false;
  try{
    const reg=await navigator.serviceWorker.ready;const m=firebase.messaging();
    if(!msgInit){msgInit=true;m.onMessage(p=>{const d=p.data||{};if(U.role==='student'&&d.body)toast(d.body)})}
    const token=await m.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
    if(!token)return false;
    await fdb.collection('tokens').doc(token).set({role:U.role,sid:U.role==='student'?U.sid:null,at:Date.now(),ua:navigator.userAgent.slice(0,120)});
    try{localStorage.setItem(KEY+'-tok',token)}catch(e){}
    return true;
  }catch(e){console.warn('push',e);return false}
}
async function notifyServer(type,id){
  if(!LIVE||!VAPID||!fauth||!fauth.currentUser)return;
  await new Promise(r=>setTimeout(r,1500));
  try{const t=await fauth.currentUser.getIdToken();
    await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({type,id})})}catch(e){console.warn('notify',e)}
}
const notifState=()=>!('Notification' in window)?'no':Notification.permission;
function notifBox(student){
  const st=notifState();if(st==='granted'||st==='no')return '';
  return `<div class="slab dark" style="display:flex;flex-direction:column;gap:10px"><div class="h3">Activá los avisos</div>
    <div class="dim" style="font-size:14px">${student?'Te avisamos en el celular cuando el profe confirma o rechaza tu turno.':'Te avisamos cuando un alumno pide un turno.'}${/iPhone|iPad/.test(navigator.userAgent)?' En iPhone, primero instalá la app con Compartir → Agregar a inicio y abrila desde ahí.':''}</div>
    ${st==='denied'?'<div class="dim" style="font-size:13px">Los avisos están bloqueados. Activalos desde la configuración del navegador para esta página.</div>':`<button class="btn g" data-act="notifOn">Activar avisos</button>`}</div>`;
}
function boot(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(!LIVE){render();return}
  firebase.initializeApp(FBCFG);
  fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  fauth=firebase.auth();
  render();
  fauth.onAuthStateChanged(user=>{
    if(loggingIn)return;
    if(!user){U.role=null;stopListen();render();return}
    const isAdmin=!user.isAnonymous&&(user.email||'').toLowerCase()===ADMIN_EMAIL;
    if(isAdmin){U.role='admin';if(!['panel','agenda','planes','alumnos','rank','ajustes'].includes(U.tab))U.tab='panel'}
    else if(user.isAnonymous&&U.sid){U.role='student'}
    else{fauth.signOut();return}
    saveU();listen();render();registerPush();
  });
}

/* ============ REGLAS ============ */
const C=()=>D.cfg;
const stu=id=>D.students.find(s=>s.id===id);
const fullName=s=>s.nombre+' '+s.apellido;

function pack(st){
  const p=st.pack;if(!p)return null;
  const end=add(p.start,30);
  const inPack=D.sessions.filter(s=>s.sid===st.id&&s.date>=p.start&&s.date<end).sort((a,b)=>(a.date+a.h).localeCompare(b.date+b.h));
  const used=inPack.filter(s=>s.status==='P'||(C().ausenteDescuenta&&s.status==='A'));
  const dl=diff(end,TODAY);
  return {size:p.size,start:p.start,end,inPack,used,rem:Math.max(0,p.size-used.length),dl,expired:dl<=0};
}
function points(st){
  const o={...st.base};AREAS.forEach(([k])=>o[k]=o[k]||0);
  D.sessions.forEach(s=>{if(s.sid===st.id&&s.status==='P'&&s.area)o[s.area]+=PTS});
  return o;
}

const attMonth=(st,ym)=>{const ss=D.sessions.filter(s=>s.sid===st.id&&s.date.slice(0,7)===ym);return{p:ss.filter(s=>s.status==='P').length,a:ss.filter(s=>s.status==='A').length}};

function slotsFor(date){

}

function alerts(){
  const c=C();const out={vence:[],pocas:[],inact:[],vencido:[]};
  D.students.forEach(st=>{const p=pack(st);if(!p)return;
    if(p.expired)out.vencido.push(st);
    else{if(p.dl<=c.alertaVence)out.vence.push(st);if(p.rem<=c.alertaSesiones)out.pocas.push(st)}
    const lp=lastPresent(st);if(!lp||diff(TODAY,lp)>=c.inactivo)out.inact.push(st)});

}

function calendar(ym,opts){

  const lead=(first.getDay()+6)%7;let h=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'].map(d=>`<div class="dh">${d}</div>`).join('');

function radar(st){
  const s=st.stats||{};const STATS=statsOf(st);const cx=170,cy=150,R=108,n=STATS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/10,cy+Math.sin(a)*R*v/10]};
  let g='';[2,4,6,8,10].forEach(v=>{g+=`<polygon points="${STATS.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${v===10?2:1}"/>`});
  STATS.forEach((_,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`});
  const poly=STATS.map(([k],i)=>pt(i,s[k]||0).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="var(--gold)" fill-opacity=".35" stroke="var(--gold)" stroke-width="3" stroke-linejoin="miter"/>`;
  STATS.forEach(([k],i)=>{const[x,y]=pt(i,s[k]||0);g+=`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="var(--gold)"/>`});
  STATS.forEach(([k,nm],i)=>{const[x,y]=pt(i,12.6);const anchor=Math.abs(x-cx)<5?'middle':(x>cx?'start':'end');
    g+=`<text x="${x}" y="${y-4}" text-anchor="${anchor}" fill="var(--dim)" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="1">${nm.toUpperCase()}</text><text x="${x}" y="${y+16}" text-anchor="${anchor}" fill="var(--bone)" font-family="Big Shoulders Display,Impact,sans-serif" font-size="22" font-weight="900">${s[k]||0}</text>`});
  return `<svg class="radar" viewBox="0 0 340 310" role="img" aria-label="Stats de ${esc(st.nombre)}">${g}</svg>`;
}

const fnum=v=>(Math.round(v*10)/10).toLocaleString('es-AR');

function lineChart(pts,unit){
  const W=340,H=190,L=44,R=20,T=24,B=34;const n=pts.length;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<1){lo-=1;hi+=1}const padv=(hi-lo)*0.15;lo-=padv;hi+=padv;
  const t0=P(pts[0].f).getTime(),t1=P(pts[n-1].f).getTime();
  const x=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*((P(pts[i].f).getTime()-t0)/((t1-t0)||1));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';
  [0,0.5,1].forEach(f=>{const v=lo+(hi-lo)*f;const yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" fill="var(--dim)" font-family="JetBrains Mono,monospace" font-size="10">${fnum(v)}</text>`});
  if(n>1){const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    g+=`<path d="${d} L${x(n-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z" fill="var(--gold)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="miter"/>`}
  pts.forEach((p,i)=>{const last=i===n-1;const sz=last?10:7;g+=`<rect x="${x(i)-sz/2}" y="${y(p.v)-sz/2}" width="${sz}" height="${sz}" fill="${last?'var(--gold)':'var(--ink)'}" stroke="var(--gold)" stroke-width="2"/>`;
    if(last||i===0||n<=5){const anc=n===1?'middle':(i===0?'start':(last?'end':'middle'));g+=`<text x="${x(i)}" y="${y(p.v)-10}" text-anchor="${anc}" fill="${last?'var(--gold)':'var(--bone)'}" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="${last?18:14}">${fnum(p.v)}</text>`}});
  const lab=n<=4?pts.map((_,i)=>i):[0,n-1];
  lab.forEach(i=>{const anc=n===1?'middle':(i===0?'start':(i===n-1?'end':'middle'));g+=`<text x="${x(i)}" y="${H-12}" text-anchor="${anc}" fill="var(--dim)" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700">${fd(pts[i].f)}</text>`});
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${unit}">${g}</svg>`;
}
function checksCharts(st){
  const recs=ckSorted(st);if(recs.length<2)return '';
  const avail=CHK.filter(([k])=>recs.filter(r=>hasV(r[k])).length>=2);
  if(!avail.length)return '';
  const m=avail.some(([k])=>k===U.ckM)?U.ckM:avail[0][0];
  const pts=recs.filter(r=>hasV(r[m])).map(r=>({f:r.fecha,v:+r[m]}));
  const tot=Math.round((pts[pts.length-1].v-pts[0].v)*10)/10;
  // comparación radial
  const last=recs[recs.length-1];const older=recs.slice(0,-1).reverse();
  const cmp=older.find(r=>r.id===U.ckCmp)||older[0];
  const axes=CHK.filter(([k])=>k!=='peso'&&hasV(last[k])&&hasV(cmp[k]));
  let radarH='';
  if(axes.length>=3){
    const cx=170,cy=150,Rr=104,n=axes.length;
    const scale=k=>{const v=recs.filter(r=>hasV(r[k])).map(r=>+r[k]);return[Math.min(...v),Math.max(...v)]};
    const pos=(k,v)=>{const[lo,hi]=scale(k);return hi===lo?0.7:0.3+0.7*(v-lo)/(hi-lo)};
    const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*Rr*f,cy+Math.sin(a)*Rr*f]};
    let g='';[0.3,0.65,1].forEach(f=>{g+=`<polygon points="${axes.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${f===1?2:1}"/>`});
    axes.forEach((_,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
    g+=`<polygon points="${axes.map(([k],i)=>pt(i,pos(k,+cmp[k])).join(',')).join(' ')}" fill="none" stroke="var(--bone)" stroke-width="2" stroke-dasharray="5 4"/>`;
    g+=`<polygon points="${axes.map(([k],i)=>pt(i,pos(k,+last[k])).join(',')).join(' ')}" fill="var(--gold)" fill-opacity=".3" stroke="var(--gold)" stroke-width="3"/>`;
    axes.forEach(([k,nm],i)=>{const[x,y]=pt(i,1.24);const anc=Math.abs(x-cx)<5?'middle':(x>cx?'start':'end');const d=Math.round((last[k]-cmp[k])*10)/10;
      g+=`<text x="${x}" y="${y-3}" text-anchor="${anc}" fill="var(--dim)" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700">${nm.toUpperCase().replace('BÍCEPS ','BÍC. ')}</text><text x="${x}" y="${y+13}" text-anchor="${anc}" fill="${d?'var(--gold)':'var(--bone)'}" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="15">${d>0?'+':''}${fnum(d)}</text>`});
    radarH=`<svg class="radar" viewBox="-20 0 380 310" role="img" aria-label="Comparación de medidas">${g}</svg>
    <div class="eyebrow" style="display:flex;gap:14px;flex-wrap:wrap"><span><i class="lg ap"></i> ${fd(last.fecha)} (ÚLTIMO)</span><span><i class="lg" style="border-style:dashed;border-color:var(--bone)"></i> ${fd(cmp.fecha)}</span></div>
    <div class="dim" style="font-size:13px">Cada eje tiene su propia escala, del valor más bajo al más alto registrado. Sirve para ver qué medidas cambiaron, no para comparar una medida con otra. El número es la diferencia en cm.</div>`;
  }else radarH='<div class="empty-s">Para comparar hacen falta al menos 3 medidas en cm cargadas en los dos chequeos.</div>';
  return `<div class="sec"><div class="sechead"><h2 class="h3" style="font-size:19px">Evolución</h2><span class="eyebrow">${pts.length} registros</span></div>
    <div class="lbtabs">${avail.map(([k,nm])=>`<button class="${k===m?'on':''}" data-act="ckM" data-k="${k}">${nm.toUpperCase()}</button>`).join('')}</div>
    <div class="statrow"><div><div class="h2">${fnum(pts[pts.length-1].v)}<span class="eyebrow" style="margin-left:4px">${ckUnit(m)}</span></div><div class="eyebrow">Actual</div></div><div><div class="h2 ${tot?'gold':''}">${tot>0?'+':''}${fnum(tot)}</div><div class="eyebrow">Desde ${fd(pts[0].f)}</div></div><div><div class="h2">${fnum(Math.min(...pts.map(p=>p.v)))}–${fnum(Math.max(...pts.map(p=>p.v)))}</div><div class="eyebrow">Mín–máx</div></div></div>
    ${lineChart(pts,ckUnit(m))}
  </div>
  <div class="sec"><div class="sechead"><h2 class="h3" style="font-size:19px">Comparar medidas</h2></div>
    <div class="field"><label for="ckcmp">Último chequeo contra</label><select class="inp" id="ckcmp">${older.map(r=>`<option value="${r.id}" ${r.id===cmp.id?'selected':''}>${fd(r.fecha)} ${r.fecha.slice(0,4)}</option>`).join('')}</select></div>
    ${radarH}
  </div>`;
}

function vRank(me){
  const by=U.lbBy||'tot';const ym=TODAY.slice(0,7);

  const show=x=>by==='rango'?(x.st.rango||'—'):x.v;

  ${mine?`<div class="slab dark" style="display:flex;align-items:center;gap:14px;padding:12px 14px"><div class="h2" style="font-size:54px;color:var(--gold)">#${mine.pos}</div><div class="grow"><div class="eyebrow">Tu puesto</div><div class="h3">${show(mine)} ${unit}</div></div></div>`:''}

/* ============ RENDER ============ */
let toastT;
function toast(msg){clearTimeout(toastT);let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;el.hidden=false;toastT=setTimeout(()=>el.hidden=true,2800)}
function render(){
  const root=document.getElementById('root');
  if(!U.role){root.innerHTML=`<div class="app">${vLogin()}</div>`;return}
  if(!isLoaded()){root.innerHTML=`<div class="app"><div class="login"><div class="mark">Zen<br>do<span>//</span><br>App</div><div class="eyebrow">Cargando…</div><div></div></div></div>`;return}
  const admin=U.role==='admin';
  if(admin&&!['panel','agenda','planes','alumnos','rank','ajustes'].includes(U.tab))U.tab='panel';
  if(!admin&&!['hoy','plan','turnos','asist','rank','yo'].includes(U.tab))U.tab='hoy';
  const st=admin?null:stu(U.sid);
  if(!admin&&!st){A.logout();return}
  const tabs=admin?[['panel','PANEL'],['agenda','AGENDA'],['planes','PLANES'],['alumnos','ALUMNOS'],['rank','RANK']]:[['hoy','HOY'],['plan','PLAN'],['turnos','TURNOS'],['asist','ASIST.'],['rank','RANK'],['yo','YO']];
  const pe=admin?pending().length+toMark().length:0;
  let main='';
  if(admin)main={panel:vPanel,agenda:vAgenda,planes:vPlanes,alumnos:vAlumnos,rank:()=>vRank(null),ajustes:vAjustes}[U.tab]();
  else main={hoy:vHoy,plan:vPlan,turnos:vTurnos,asist:vAsist,rank:vRank,yo:vYo}[U.tab](st);
  root.innerHTML=`<div class="app">
   <header class="top"><div class="brand">ZENDO<span class="gold">APP</span><small>${admin?'ADMIN · PROFE':esc(fullName(st)).toUpperCase()}</small></div>
   ${admin?`<button class="ib" data-act="bell" aria-label="Avisos">AVISOS${pe?`<span class="badge">${pe}</span>`:''}</button><button class="ib" data-act="tab" data-tab="ajustes" aria-label="Ajustes">⚙</button>`:''}
   <button class="ib" data-act="logout">SALIR</button></header>
   <main>${main}</main></div>
   <nav class="nav"><div class="in">${tabs.map(([k,l])=>`<button class="${U.tab===k||(k==='panel'&&U.tab==='ajustes')?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div></nav>
   ${sheetHTML()}`;
}
const rerender=()=>{save();saveU();const y=window.scrollY;render();window.scrollTo(0,y)};
const go=()=>{save();saveU();render();window.scrollTo(0,0)};

/* ============ ACCIONES ============ */
const A={
  async login(){const err=t=>{const e=document.getElementById('lerr');if(e)e.textContent=t};
    const v=norm(document.getElementById('key').value||'');if(!v)return err('Escribí tu clave.');
    if(!LIVE){const st=D.students.find(s=>norm(s.nombre+s.apellido)===v);
      if(st){U.role='student';U.sid=st.id;U.tab='hoy';U.calMonth=TODAY.slice(0,7);return go()}
      return err('Clave incorrecta. Es tu nombre y apellido juntos.')}
    err('Entrando…');loggingIn=true;
    try{
      if(!fauth.currentUser||!fauth.currentUser.isAnonymous)await fauth.signInAnonymously();
      const q=await fdb.collection('students').get();
      const st=q.docs.map(d=>d.data()).find(s=>norm(s.nombre+s.apellido)===v);
      if(!st){await fauth.signOut();loggingIn=false;return err('Clave incorrecta. Es tu nombre y apellido juntos.')}
      U.sid=st.id;U.role='student';U.tab='hoy';U.calMonth=TODAY.slice(0,7);loggingIn=false;saveU();listen();go();registerPush();
    }catch(e){loggingIn=false;console.error(e);err(e.code==='auth/operation-not-allowed'||e.code==='auth/admin-restricted-operation'?'Falta activar el acceso anónimo en Firebase.':'No se pudo entrar. Revisá la conexión.')}},
  async adminLogin(){const err=t=>{const e=document.getElementById('lerr');if(e)e.textContent=t};
    const em=document.getElementById('aem').value.trim(),pw=document.getElementById('apw').value;if(!em||!pw)return err('Completá email y contraseña.');
    if(em.toLowerCase()!==ADMIN_EMAIL)return err('Ese email no es el del profe.');
    err('Entrando…');try{await fauth.signInWithEmailAndPassword(em,pw)}catch(e){err('Email o contraseña incorrectos.')}},
  adminForm(){U.adminForm=!U.adminForm;render()},
  as(e){const r=e.dataset.r;if(r==='admin'){U.role='admin';U.tab='panel'}else{U.role='student';U.sid=r;U.tab='hoy'}U.calMonth=TODAY.slice(0,7);U.prof=null;go()},
  async logout(){
    if(LIVE&&fdb&&fauth&&fauth.currentUser){let tok=null;try{tok=localStorage.getItem(KEY+'-tok')}catch(e){}
      if(tok){try{await fdb.collection('tokens').doc(tok).set({role:'none',sid:null,at:Date.now()})}catch(e){}}}
    U.role=null;U.sid=null;U.prof=null;U.sheet=null;U.tab=null;seenPend=null;
    if(LIVE){stopListen();synced={};D=emptyD();try{fauth.signOut()}catch(e){}}
    go()},
  notifOn(){if(!('Notification' in window))return toast('Este celular no permite avisos desde la app.');
    Notification.requestPermission().then(async p=>{

      if(LIVE&&!VAPID){toast('Avisos activados mientras la app esté abierta. Falta la clave de avisos en config.js para recibirlos con la app cerrada.');return rerender()}

  newCheck(e){U.sheet={type:'check',sid:e.dataset.sid,cid:null};rerender()},
  editCheck(e){U.sheet={type:'check',sid:e.dataset.sid,cid:e.dataset.id};rerender()},
  saveCheck(){const sh=U.sheet;const st=stu(sh.sid);st.checks=st.checks||[];
    const rec={id:sh.cid||nid(),fecha:document.getElementById('ck-f').value||TODAY};
    CHK.forEach(([k])=>{const v=parseFloat(String(document.getElementById('ck-'+k).value).replace(',','.'));if(!isNaN(v))rec[k]=v});
    const old=sh.cid?st.checks.find(c=>c.id===sh.cid):null;if(old&&old.notas)rec.notas=old.notas;
    st.checks=st.checks.filter(c=>c.id!==rec.id);st.checks.push(rec);U.sheet=null;rerender();toast(sh.cid?'Chequeo actualizado.':'Chequeo guardado.')},
  delCheck(e){const st=stu(e.dataset.sid);st.checks=st.checks.filter(c=>c.id!==e.dataset.id);rerender()},
  editStudent(e){U.sheet={type:'edit',sid:e.dataset.sid};rerender()},
  saveEdit(){const st=stu(U.sheet.sid);const n=document.getElementById('ed-n').value.trim(),a=document.getElementById('ed-a').value.trim();if(!n||!a)return toast('Falta nombre o apellido.');
    if(D.students.some(s=>s.id!==st.id&&norm(s.nombre+s.apellido)===norm(n+a)))return toast('Ya existe otro alumno con ese nombre y apellido.');
    st.nombre=n;st.apellido=a;st.disc=document.getElementById('ed-d').value;st.nac=document.getElementById('ed-b').value||null;const pz=parseFloat(document.getElementById('ed-p').value);st.peso=isNaN(pz)?null:pz;const hz=parseFloat(document.getElementById('ed-h').value);st.altura=isNaN(hz)?null:hz;U.sheet=null;rerender();toast('Datos guardados.')},
  rep(e){const st=stu(e.dataset.sid);st.plan.repeat=!st.plan.repeat;if(!st.plan.repeat)st.plan.month=U.planMonth;rerender();toast(st.plan.repeat?'El plan se mantiene todos los meses.':'El plan vale sólo para '+ymLabel(U.planMonth).toLowerCase()+'.')},
  planPrev(){U.planMonth=ymShift(U.planMonth,-1);U.planWeek=null;rerender()},
  planNext(){U.planMonth=ymShift(U.planMonth,1);U.planWeek=null;rerender()},
  openPlan(e){U.sheet={type:'plan',sid:e.dataset.sid,ym:U.planMonth,day:null};rerender()},
  pdPrev(){U.sheet.ym=ymShift(U.sheet.ym,-1);U.sheet.day=null;rerender()},
  pdNext(){U.sheet.ym=ymShift(U.sheet.ym,1);U.sheet.day=null;rerender()},
  planDay(e){U.sheet.day=e.dataset.d;rerender()},
  saveNote(){const st=stu(U.sheet.sid);const t=document.getElementById('n-text').value.trim();const a=document.getElementById('n-area').value;
    if(!t&&!a)return toast('Escribí algo o elegí un área.');st.notes[U.sheet.day]={area:a||null,text:t};rerender();toast('Nota guardada.')},
  delNote(){delete stu(U.sheet.sid).notes[U.sheet.day];rerender()},
  copyPlan(){const st=stu(U.sheet.sid);const from=stu(document.getElementById('copyFrom').value);st.plan.weeks=JSON.parse(JSON.stringify(from.plan.weeks));rerender();toast('Plan de '+from.nombre+' copiado.')},
  closeSheet(){U.sheet=null;rerender()},
  scrim(e,ev){if(ev.target===e){U.sheet=null;rerender()}},
  openProf(e){U.tab='alumnos';U.prof=e.dataset.sid;U.ptab='res';U.ckM=null;U.ckCmp=null;go()},
  closeProf(){U.prof=null;go()},
  renew(e){U.sheet={type:'renew',sid:e.dataset.sid};rerender()},
  renSize(e){U.sheet.size=+e.dataset.n;rerender()},
  saveRenew(){const st=stu(U.sheet.sid);const size=U.sheet.size||st.pack.size;const m=+document.getElementById('rn-m').value||0;const d=document.getElementById('rn-d').value||TODAY;
    st.pack={size,start:d};D.pays.push({id:nid(),sid:st.id,date:d,size,monto:m});U.sheet=null;rerender();toast('Pago guardado. Pack de '+size+' hasta el '+fd(add(d,30))+'.')},
  newStudent(){U.sheet={type:'new',size:12};rerender()},
  nsSize(e){const ids=['ns-n','ns-a','ns-d','ns-b','ns-p','ns-h','ns-f'];const keep=ids.map(i=>document.getElementById(i).value);U.sheet.size=+e.dataset.n;rerender();
    ids.forEach((i,j)=>document.getElementById(i).value=keep[j])},
  saveNew(){const n=document.getElementById('ns-n').value.trim(),a=document.getElementById('ns-a').value.trim();if(!n||!a)return toast('Falta nombre o apellido.');
    if(D.students.some(s=>norm(s.nombre+s.apellido)===norm(n+a)))return toast('Ya existe un alumno con ese nombre y apellido.');
    const size=U.sheet.size||12;const d=document.getElementById('ns-f').value||TODAY;const id=nid();
    D.students.push({id,nombre:n,apellido:a,disc:document.getElementById('ns-d').value,nac:document.getElementById('ns-b').value||null,peso:parseFloat(document.getElementById('ns-p').value)||null,altura:parseFloat(document.getElementById('ns-h').value)||null,stats:Object.fromEntries([...STATS,...STATS_F].map(([k])=>[k,5])),checks:[],pack:{size,start:d},base:{},plan:{weeks:emptyWeeks(),repeat:true,month:TODAY.slice(0,7)},notes:{},records:[]});
    D.pays.push({id:nid(),sid:id,date:d,size,monto:+document.getElementById('ns-m').value||0});U.sheet=null;U.prof=id;go();toast('Alumno creado. Clave: '+norm(n+a))},
  addRec(e){const ej=document.getElementById('rec-ej').value.trim(),mk=document.getElementById('rec-mk').value.trim();if(!ej||!mk)return toast('Completá ejercicio y marca.');
    stu(e.dataset.sid).records.push({id:nid(),ej,marca:mk,fecha:TODAY});rerender();toast('Récord guardado.')},
  delRec(e){const st=stu(e.dataset.sid);st.records=st.records.filter(r=>r.id!==e.dataset.id);rerender()},
  delStudent(e){const st=stu(e.dataset.sid);U.sheet={type:'confirm',title:'¿Eliminar a '+fullName(st)+'?',text:'Se borran su pack, sesiones, reservas, plan y récords. No se puede deshacer.',yes:'Eliminar',run:'delStudentGo',sid:st.id};rerender()},
  confirmYes(){const sh=U.sheet;U.sheet=null;if(sh.run==='delStudentGo'){D.students=D.students.filter(s=>s.id!==sh.sid);D.sessions=D.sessions.filter(s=>s.sid!==sh.sid);D.res=D.res.filter(s=>s.sid!==sh.sid);U.prof=null;go()}
    if(sh.run==='weekNextGo'){const w=U.planWeek;D.students.forEach(st=>{st.plan.weeks[w+1]=JSON.parse(JSON.stringify(st.plan.weeks[w]))});U.planWeek=w+1;rerender();toast('Semana copiada para todos.')}
    if(sh.run==='resetGo'){D=seed();U.prof=null;U.tab='panel';go();toast('Datos de ejemplo restaurados.')}},
  tgAus(){C().ausenteDescuenta=!C().ausenteDescuenta;rerender()},
  tgDia(e){const d=+e.dataset.d;const a=C().dias;const i=a.indexOf(d);i>=0?a.splice(i,1):a.push(d);rerender()},
  delTurno(e){C().turnos.splice(+e.dataset.i,1);rerender()},
  tgTDia(e){const t=C().turnos[+e.dataset.i];const d=+e.dataset.d;if(!t.dias)t.dias=[...WD];const i=t.dias.indexOf(d);
    if(i>=0){t.dias.splice(i,1)}else{const o=C().turnos.find(x=>x!==t&&x.h===t.h&&(!x.dias||x.dias.includes(d)));if(o)return toast('Ese día ya tiene un turno a las '+t.h+'.');t.dias.push(d)}rerender()},
  tgNewTDia(e){const d=+e.dataset.d;U.newTDias=U.newTDias||[...C().dias];const i=U.newTDias.indexOf(d);i>=0?U.newTDias.splice(i,1):U.newTDias.push(d);
    const h=document.getElementById('t-h').value,du=document.getElementById('t-d').value;rerender();document.getElementById('t-h').value=h;document.getElementById('t-d').value=du},
  addTurno(){const h=document.getElementById('t-h').value;const d=Math.round(+document.getElementById('t-d').value);
    if(!h)return toast('Elegí la hora de inicio.');if(!(d>0))return toast('Poné la duración en minutos.');
    const dias=[...(U.newTDias||C().dias)];if(!dias.length)return toast('Elegí al menos un día.');
    const clash=C().turnos.find(t=>t.h===h&&(!t.dias||t.dias.some(x=>dias.includes(x))));if(clash)return toast('Ya hay un turno a las '+h+' en alguno de esos días.');
    C().turnos.push({h,d,dias});C().turnos.sort((a,b)=>hm(a.h)-hm(b.h));U.newTDias=null;rerender();toast('Turno agregado.')},
  tgOcc(e){const c=C();c.ocupados=c.ocupados||{};const k=ocKey(e.dataset.d,e.dataset.h);
    if(c.ocupados[k])delete c.ocupados[k];else c.ocupados[k]=true;
    Object.keys(c.ocupados).forEach(x=>{if(x.split('|')[0]<add(TODAY,-30))delete c.ocupados[x]});rerender()},
  reset(){U.sheet={type:'confirm',title:'¿Reiniciar la demo?',text:'Se borran todos los cambios y vuelven los datos de ejemplo.',yes:'Reiniciar',run:'resetGo'};rerender()},
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;
  if(el.dataset.act==='scrim'){if(ev.target===el)f(el,ev);return}f(el,ev)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='ckcmp'){U.ckCmp=el.value;rerender();return}const k=el.dataset&&el.dataset.chg;if(!k)return;const v=+el.value;if(isNaN(v))return;
  if(k==='precio')C().precios[el.dataset.n]=v;else if(v>0)C()[k]=v;save();});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='key')A.login();if(ev.key==='Escape'&&U.sheet){U.sheet=null;rerender()}});
boot();
</script>
